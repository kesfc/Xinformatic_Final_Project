<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Country Code</title>
</head>
<body>
    <h2>Enter Country Code and Values</h2>
    <form action="/plot" method="post">
        <label for="code">Country Code:</label>
        <input type="text" id="code" name="code" required><br><br>
        <label for="x1">Value for x1:</label>
        <input type="number" id="x1" name="x1" required><br><br>
        <label for="x2">Value for x2:</label>
        <input type="number" id="x2" name="x2" required><br><br>
        <button type="submit">Plot</button>
    </form>
</body>
</html>
